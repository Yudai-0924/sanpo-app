<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>三鳳 開発者ページ</title>
<style>
:root { --bg: #0e1514; --panel: #16221f; --line: rgba(194,164,106,.3); --text: #e6e0d1; --muted: #93a59d; --gold: #c2a46a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 12px; color: var(--gold); }
h2 { font-size: 16px; margin: 22px 0 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input { flex: 1; min-width: 200px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: #0b1110; color: var(--text); font: inherit; }
button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: #22352f; color: var(--text); font: inherit; cursor: pointer; }
button.gold { background: linear-gradient(180deg, #f0d48e, #c49a4c); color: #1d1405; font-weight: 700; border: 0; }
.msg { color: var(--muted); margin: 8px 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.card .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; }
.card .cat { color: #1d1405; background: var(--gold); border-radius: 999px; padding: 0 8px; font-weight: 700; }
.card .text { white-space: pre-wrap; margin: 6px 0; overflow-wrap: anywhere; }
.card .dev { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 6px; border-bottom: 1px solid rgba(194,164,106,.18); }
.wrap { overflow-x: auto; }
</style></head>
<body>
<h1>三鳳 開発者ページ</h1>
<div class="row"><input id="key" type="password" placeholder="開発者の鍵" autocomplete="off"><button class="gold" id="load">読み込む</button></div>
<p class="msg" id="msg">鍵を入れて「読み込む」を押してください（この端末に覚えます）。</p>
<h2>意見・不具合の報告 <span id="fbn"></span></h2>
<div id="fb"></div>
<h2>遊んでいる人が作ったルール <span id="rln"></span></h2>
<div class="wrap" id="rl"></div>
<script>
(function () {
  var CAT = { bug: '不具合', idea: '要望', cpu: 'CPU', other: 'その他' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (t) { var d = new Date(t); return d.toLocaleString('ja-JP'); };
  // 開発者用アプリ（アーティファクト版）から開いたとき：#k=鍵 で自動で読み込む（#raw なら中身をそのまま表示）
  var hp = {}; (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); hp[i < 0 ? kv : kv.slice(0, i)] = i < 0 ? '1' : decodeURIComponent(kv.slice(i + 1)); });
  var RAW = !!hp.raw;
  try { $('key').value = hp.k || localStorage.getItem('sanpo.admin') || ''; } catch (e) { $('key').value = hp.k || ''; }
  if (hp.k && !RAW) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  function load() {
    var key = $('key').value.trim();
    try { localStorage.setItem('sanpo.admin', key); } catch (e) {}
    $('msg').textContent = '読み込み中…';
    if (RAW) {
      Promise.all([fetch('/api/feedback', { headers: { 'x-admin-key': key }, cache: 'no-store' }).then(function (r) { return r.json(); }), fetch('/api/rules', { cache: 'no-store' }).then(function (r) { return r.json(); })]).then(function (a) {
        document.body.innerHTML = '<pre id="raw"></pre>';
        document.getElementById('raw').textContent = JSON.stringify({ feedback: a[0].items || null, count: a[0].count, rules: a[1].items || [] });
      });
      return;
    }
    fetch('/api/feedback', { headers: { 'x-admin-key': key }, cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.items) { $('msg').textContent = '鍵が違います（件数だけ：' + (d.count || 0) + '件）'; $('fb').innerHTML = ''; return; }
      $('msg').textContent = '読み込みました';
      $('fbn').textContent = '（' + d.items.length + '件）';
      $('fb').innerHTML = d.items.map(function (x) {
        return '<div class="card"><div class="meta"><span class="cat">' + esc(CAT[x.cat] || x.cat) + '</span><span>' + esc(fmt(x.t)) + '</span><span>' + esc(x.name || '名前なし') + '</span>' + (x.contact ? '<span>連絡先：' + esc(x.contact) + '</span>' : '') + (x.friend ? '<span>フレンドコード：' + esc(x.friend) + '</span>' : '') + '</div>'
          + '<div class="text">' + esc(x.text) + '</div><div class="dev">版 ' + esc(x.ver) + '　' + esc(x.dev) + '</div>'
          + '<div class="row" style="margin-top:6px"><button data-del="' + esc(x.key) + '">削除</button></div></div>';
      }).join('') || '<p class="msg">まだありません</p>';
    }).catch(function () { $('msg').textContent = '読み込めませんでした'; });
    fetch('/api/rules', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var it = d.items || [];
      $('rln').textContent = '（' + it.length + '種類）';
      $('rl').innerHTML = it.length ? '<table><tr><th>名前</th><th>キー</th><th>端末数</th><th>最初</th><th>最後</th></tr>' + it.map(function (x) {
        return '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.key) + '</td><td>' + esc(x.n) + '</td><td>' + esc(fmt(x.first)) + '</td><td>' + esc(fmt(x.last)) + '</td></tr>';
      }).join('') + '</table>' : '<p class="msg">まだありません</p>';
    });
  }
  $('load').addEventListener('click', load);
  $('fb').addEventListener('click', function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute('data-del');
    if (!k || !window.confirm('この報告を削除しますか？')) return;
    fetch('/api/feedback?key=' + encodeURIComponent(k), { method: 'DELETE', headers: { 'x-admin-key': $('key').value.trim() } }).then(load);
  });
  if ($('key').value) load();
})();
</script>
</body></html>

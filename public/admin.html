<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>三鳳 開発者ページ</title>
<style>
:root { --bg: #0e1514; --panel: #16221f; --line: rgba(194,164,106,.3); --text: #e6e0d1; --muted: #93a59d; --gold: #c2a46a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 12px; color: var(--gold); }
h2 { font-size: 16px; margin: 22px 0 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input { flex: 1; min-width: 200px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: #0b1110; color: var(--text); font: inherit; }
button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: #22352f; color: var(--text); font: inherit; cursor: pointer; }
button.gold { background: linear-gradient(180deg, #f0d48e, #c49a4c); color: #1d1405; font-weight: 700; border: 0; }
.msg { color: var(--muted); margin: 8px 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.card .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; }
.card .cat { color: #1d1405; background: var(--gold); border-radius: 999px; padding: 0 8px; font-weight: 700; }
.card .text { white-space: pre-wrap; margin: 6px 0; overflow-wrap: anywhere; }
.card .dev { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 6px; border-bottom: 1px solid rgba(194,164,106,.18); }
.wrap { overflow-x: auto; }
.card.new { border-color: #8fe0b0; box-shadow: 0 0 0 2px rgba(143,224,176,.35); }
.card .newtag { color: #0e1514; background: #8fe0b0; border-radius: 999px; padding: 0 8px; font-weight: 700; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #8fe0b0; box-shadow: 0 0 6px #8fe0b0; }
</style></head>
<body>
<h1>三鳳 開発者ページ</h1>
<div class="row"><input id="key" type="password" placeholder="開発者の鍵" autocomplete="off"><button class="gold" id="load">読み込む</button></div>
<p class="msg" id="msg">鍵を入れて「読み込む」を押してください（この端末に覚えます）。</p>
<div class="row"><span class="live" id="live" hidden><i></i>自動で更新中（10秒ごと）</span><button id="notif" hidden>新しい意見を通知する</button></div>
<h2>意見・不具合の報告 <span id="fbn"></span></h2>
<div id="fb"></div>
<h2>アプリの不具合（自動報告） <span id="ern"></span></h2>
<div class="row"><button id="errclr" hidden>すべて消す</button></div>
<div id="er"></div>
<h2>使っている人</h2>
<div class="wrap" id="usr"></div>
<h2>利用状況（日ごと） <span id="usn"></span></h2>
<div class="wrap" id="us"></div>
<h2>遊んでいる人が作ったルール <span id="rln"></span></h2>
<div class="wrap" id="rl"></div>
<script>
(function () {
  var CAT = { bug: '不具合', idea: '要望', cpu: 'CPU', other: 'その他' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (t) { var d = new Date(t); return d.toLocaleString('ja-JP'); };
  // 開発者用アプリ（アーティファクト版）から開いたとき：#k=鍵 で自動で読み込む（#raw なら中身をそのまま表示）
  var hp = {}; (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); hp[i < 0 ? kv : kv.slice(0, i)] = i < 0 ? '1' : decodeURIComponent(kv.slice(i + 1)); });
  var RAW = !!hp.raw;
  try { $('key').value = hp.k || localStorage.getItem('sanpo.admin') || ''; } catch (e) { $('key').value = hp.k || ''; }
  if (hp.k && !RAW) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  var known = null, timer = 0, base = document.title;
  function load(quiet) {
    var key = $('key').value.trim();
    try { localStorage.setItem('sanpo.admin', key); } catch (e) {}
    if (!quiet) $('msg').textContent = '読み込み中…';
    if (RAW) {
      Promise.all([fetch('/api/feedback', { headers: { 'x-admin-key': key }, cache: 'no-store' }).then(function (r) { return r.json(); }), fetch('/api/rules', { cache: 'no-store' }).then(function (r) { return r.json(); })]).then(function (a) {
        document.body.innerHTML = '<pre id="raw"></pre>';
        document.getElementById('raw').textContent = JSON.stringify({ feedback: a[0].items || null, count: a[0].count, rules: a[1].items || [] });
      });
      return;
    }
    fetch('/api/feedback', { headers: { 'x-admin-key': key }, cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.items) { $('msg').textContent = '鍵が違います（件数だけ：' + (d.count || 0) + '件）'; $('fb').innerHTML = ''; return; }
      // 前に読んだときより新しい意見に印を付け、通知する
      var fresh = known ? d.items.filter(function (x) { return known.indexOf(x.key) < 0; }) : [];
      known = d.items.map(function (x) { return x.key; });
      if (fresh.length) {
        document.title = '(' + fresh.length + ') ' + base;
        try { if (window.Notification && Notification.permission === 'granted') new Notification('三鳳：新しい意見 ' + fresh.length + '件', { body: String(fresh[0].text || '').slice(0, 80) }); } catch (e) {}
      }
      $('msg').textContent = '最終更新 ' + new Date().toLocaleTimeString('ja-JP');
      $('live').hidden = false;
      if (window.Notification && Notification.permission === 'default') $('notif').hidden = false;
      if (!timer) timer = setInterval(function () { if (!document.hidden) load(true); }, 10000);
      $('fbn').textContent = '（' + d.items.length + '件）';
      $('fb').innerHTML = d.items.map(function (x) {
        var isNew = fresh.some(function (y) { return y.key === x.key; });
        return '<div class="card' + (isNew ? ' new' : '') + '"><div class="meta">' + (isNew ? '<span class="newtag">NEW</span>' : '') + '<span class="cat">' + esc(CAT[x.cat] || x.cat) + '</span><span>' + esc(fmt(x.t)) + '</span><span>' + esc(x.name || '名前なし') + '</span>' + (x.contact ? '<span>連絡先：' + esc(x.contact) + '</span>' : '') + (x.friend ? '<span>フレンドコード：' + esc(x.friend) + '</span>' : '') + '</div>'
          + '<div class="text">' + esc(x.text) + '</div><div class="dev">版 ' + esc(x.ver) + '　' + esc(x.dev) + '</div>'
          + '<div class="row" style="margin-top:6px"><button data-del="' + esc(x.key) + '">削除</button></div></div>';
      }).join('') || '<p class="msg">まだありません</p>';
    }).catch(function () { $('msg').textContent = '読み込めませんでした'; });
    if (!quiet) fetch('/api/err', { headers: { 'x-admin-key': key }, cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var it = d.items || [];
      $('ern').textContent = d.items ? '（' + it.length + '種類）' : '';
      $('errclr').hidden = !it.length;
      $('er').innerHTML = it.length ? it.map(function (x) {
        return '<div class="card"><div class="meta"><span class="cat">' + esc(x.n) + '回</span><span>最後 ' + esc(fmt(x.last)) + '</span><span>最初 ' + esc(fmt(x.first)) + '</span><span>' + esc(x.where) + '</span><span>版 ' + esc(x.ver) + '</span></div>'
          + '<div class="text">' + esc(x.msg) + '</div><div class="dev">' + esc(String(x.stack || '').split('\n').slice(0, 5).join('\n')) + '</div><div class="dev">' + esc(x.dev) + '</div>'
          + '<div class="row" style="margin-top:6px"><button data-edel="' + esc(x.key) + '">直したので消す</button></div></div>';
      }).join('') : '<p class="msg">' + (d.items ? '届いていません' : '鍵が必要です') + '</p>';
    }).catch(function () {});
    if (!quiet) fetch('/api/usage', { headers: { 'x-admin-key': key }, cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var days = (d.days || []).slice().reverse();
      var EV = [['open', '起動'], ['cpu', 'CPU戦'], ['friend', '友人戦'], ['practice', '練習'], ['lesson', '入門'], ['review', '牌譜'], ['whatif', 'もしも'], ['stats', '成績'], ['gacha', 'ガチャ'], ['watch', '観戦'], ['cup', '大会'], ['weekcup', '週末大会'], ['league', 'リーグ'], ['manual', '使い方'], ['newdev', '新しい端末'], ['pwa', 'ホーム画面'], ['portrait', '縦向き']];
      $('usn').textContent = days.length ? '（直近' + days.length + '日）' : '';
      $('us').innerHTML = days.length ? '<table><tr><th>日付</th><th>端末数</th>' + EV.map(function (e) { return '<th>' + e[1] + '</th>'; }).join('') + '</tr>' + days.map(function (x) {
        return '<tr><td>' + esc(x.day) + '</td><td>' + esc(x.devs) + '</td>' + EV.map(function (e) { return '<td>' + esc((x.ev || {})[e[0]] || '') + '</td>'; }).join('') + '</tr>';
      }).join('') + '</table><p class="msg">前の日の分を、次にアプリを開いたときにまとめて送ります（今日の分は明日以降に出ます）。</p>' : '<p class="msg">' + (d.days ? 'まだありません' : '鍵が必要です') + '</p>';
      var users = d.users || [];
      var top = function (ev) { return EV.filter(function (e) { return ['open', 'newdev', 'pwa', 'portrait'].indexOf(e[0]) < 0 && (ev || {})[e[0]]; }).sort(function (a, b) { return ev[b[0]] - ev[a[0]]; }).slice(0, 4).map(function (e) { return e[1] + ' ' + ev[e[0]]; }).join('・'); };
      $('usr').innerHTML = users.length ? '<p class="msg">' + users.length + '人（最後に開いた順）</p><table><tr><th>名前</th><th>ID</th><th>フレンドコード</th><th>最後に開いた</th><th>最初</th><th>開いた回数</th><th>よく使う機能</th><th>版・端末</th></tr>' + users.map(function (u) {
        return '<tr><td>' + esc(u.name || '（名前なし）') + '</td><td>' + esc(u.acct || '—') + '</td><td>' + esc(u.code || '—') + '</td><td>' + esc(u.last ? fmt(u.last) : '—') + '</td><td>' + esc(u.first ? fmt(u.first) : '—') + '</td><td>' + esc(u.opens || 0) + '</td><td>' + esc(top(u.ev)) + '</td><td class="dev">' + esc((u.ver || '') + (u.pwa ? '・ホーム画面' : '') + ' ' + (u.dev || '')) + '</td></tr>';
      }).join('') + '</table>' : '<p class="msg">' + (d.users ? 'まだありません' : '') + '</p>';
    }).catch(function () {});
    fetch('/api/rules', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var it = d.items || [];
      $('rln').textContent = '（' + it.length + '種類）';
      $('rl').innerHTML = it.length ? '<table><tr><th>名前</th><th>キー</th><th>端末数</th><th>最初</th><th>最後</th></tr>' + it.map(function (x) {
        return '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.key) + '</td><td>' + esc(x.n) + '</td><td>' + esc(fmt(x.first)) + '</td><td>' + esc(fmt(x.last)) + '</td></tr>';
      }).join('') + '</table>' : '<p class="msg">まだありません</p>';
    });
  }
  $('load').addEventListener('click', function () { load(false); });
  $('notif').addEventListener('click', function () { try { Notification.requestPermission().then(function () { $('notif').hidden = true; }); } catch (e) {} });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { document.title = base; if (known) load(true); } });
  $('fb').addEventListener('click', function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute('data-del');
    if (!k || !window.confirm('この報告を削除しますか？')) return;
    fetch('/api/feedback?key=' + encodeURIComponent(k), { method: 'DELETE', headers: { 'x-admin-key': $('key').value.trim() } }).then(function () { load(true); });
  });
  $('er').addEventListener('click', function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute('data-edel');
    if (!k) return;
    fetch('/api/err?key=' + encodeURIComponent(k), { method: 'DELETE', headers: { 'x-admin-key': $('key').value.trim() } }).then(function () { load(false); });
  });
  $('errclr').addEventListener('click', function () {
    if (!window.confirm('不具合の報告をすべて消しますか？')) return;
    fetch('/api/err?key=all', { method: 'DELETE', headers: { 'x-admin-key': $('key').value.trim() } }).then(function () { load(false); });
  });
  if ($('key').value) load(false);
})();
</script>
</body></html>
